<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Heirloom — garden</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0d1013;
        color: #7f8f88;
        font:
          13px/1.5 ui-monospace,
          monospace;
        overflow: hidden;
      }
      #wrap {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }
      /* Size comes from fitCanvas() in JS, from a single scale factor applied to BOTH
         dimensions. `max-width: 100vw` against a fixed inline height is what squashed the
         canvas to a third of its width on a phone. */
      canvas {
        display: block;
      }
      #hud {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: 10px;
        display: flex;
        gap: 14px;
        align-items: center;
        opacity: 0.75;
      }
      #hint {
        /* One line, always. On a narrow screen the hint wrapped to two and pushed itself
           over the seed tray it was describing. */
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
      }
      @media (max-width: 620px) {
        #hud {
          font-size: 11px;
        }
        /* The scene is 2.5:1. In portrait on a phone it survives, but it is a strip —
           saying so beats leaving someone to wonder why the garden is tiny. */
        #rotate {
          display: block;
        }
      }
      #rotate {
        display: none;
        position: fixed;
        top: 10px;
        left: 0;
        right: 0;
        text-align: center;
        opacity: 0.55;
        font-size: 11px;
      }
      @media (orientation: landscape) {
        #rotate {
          display: none;
        }
      }
      button {
        background: #1a2124;
        color: #cfe0d4;
        border: 1px solid #33413a;
        border-radius: 3px;
        padding: 4px 10px;
        font: inherit;
        cursor: pointer;
      }
      button:hover {
        background: #223035;
      }
      #code {
        opacity: 0.4;
        letter-spacing: 0.02em;
        cursor: pointer;
      }
      #code:hover {
        opacity: 0.8;
      }
      /* A rejected save or a bad share link must not read like an ordinary hint. */
      #hint.notice {
        color: #ecc474;
        opacity: 1;
      }
      canvas {
        touch-action: none; /* or a drag scrolls the page instead of moving a seed */
        cursor: default;
      }
    </style>
  </head>
  <body>
    <div id="rotate">turn your phone sideways for a bigger garden</div>
    <div id="wrap"><canvas id="c"></canvas></div>
    <div id="hud">
      <span id="hint"></span>
      <span id="code"></span>
    </div>
    <script type="module" src="./garden.ts"></script>
  </body>
</html>
