<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Heirloom — garden</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0d1013;
        color: #7f8f88;
        font:
          13px/1.5 ui-monospace,
          monospace;
        overflow: hidden;
      }
      #wrap {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }
      canvas {
        display: block;
        max-width: 100vw;
        max-height: 100vh;
      }
      #hud {
        position: fixed;
        left: 12px;
        bottom: 10px;
        display: flex;
        gap: 14px;
        align-items: center;
        opacity: 0.75;
      }
      button {
        background: #1a2124;
        color: #cfe0d4;
        border: 1px solid #33413a;
        border-radius: 3px;
        padding: 4px 10px;
        font: inherit;
        cursor: pointer;
      }
      button:hover {
        background: #223035;
      }
      #code {
        opacity: 0.4;
        letter-spacing: 0.02em;
      }
      canvas {
        touch-action: none; /* or a drag scrolls the page instead of moving a seed */
        cursor: default;
      }
    </style>
  </head>
  <body>
    <div id="wrap"><canvas id="c"></canvas></div>
    <div id="hud">
      <span id="hint"></span>
      <span id="code"></span>
    </div>
    <script type="module" src="./garden.ts"></script>
  </body>
</html>
