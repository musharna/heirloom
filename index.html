<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Heirloom</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0d1013;
        color: #cfe0d4;
        font:
          14px/1.7 ui-monospace,
          monospace;
      }
      main {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 26px;
      }
      h1 {
        font-size: 15px;
        font-weight: normal;
        margin: 0;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #7f8f88;
      }
      a {
        color: #cfe0d4;
        text-decoration: none;
        display: block;
        border: 1px solid #2a3630;
        border-radius: 3px;
        padding: 12px 20px;
        min-width: 22rem;
      }
      a:hover {
        border-color: #4d6357;
        background: #141a1d;
      }
      span {
        display: block;
        color: #6d7d76;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Heirloom</h1>
      <nav>
        <a href="/garden/"
          >garden
          <span>seven genomes growing in real time — the game's look</span></a
        >
        <a href="/lookdev/"
          >lookdev
          <span>one seed, one gene varied per panel — a test fixture</span></a
        >
      </nav>
    </main>
  </body>
</html>
