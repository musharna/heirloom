<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Heirloom — a shared garden</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0d1013;
        color: #7f8f88;
        font:
          13px/1.5 ui-monospace,
          monospace;
        overflow: hidden;
      }
      #wrap {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }
      /* An author `display` beats the UA stylesheet's `[hidden] { display: none }` whatever
         its specificity, so `#wrap` would stay laid out with the attribute set. The same
         reason `#card[hidden]` and `#drawer[hidden]` exist in the garden's stylesheet. */
      #wrap[hidden] {
        display: none;
      }
      /* Size comes from fit() in JS, from a single scale factor applied to BOTH dimensions.
         `max-width: 100vw` against a fixed inline height is what squashed the canvas to a
         third of its width on a phone. */
      canvas {
        display: block;
      }

      /* The strip. A visit must SAY it is a visit: without it a read-only garden is just a
         garden whose four verbs mysteriously do nothing. */
      #strip {
        position: fixed;
        left: 12px;
        right: 12px;
        top: 10px;
        display: flex;
        gap: 14px;
        align-items: baseline;
        justify-content: center;
        opacity: 0.75;
      }
      #strip a {
        color: #cfe0d4;
      }
      /* A broken link must not read like an ordinary caption. Same amber the garden's HUD
         uses for a rejected save, so the two speak with one voice. */
      #strip.notice {
        opacity: 1;
      }
      #strip.notice #strip-text {
        color: #ecc474;
      }
      @media (max-width: 620px) {
        #strip {
          font-size: 11px;
        }
      }
      /*
       * Present to assistive technology, absent from the screen.
       *
       * Not `display: none` and not `visibility: hidden` — both remove the element from the
       * accessibility tree, which is the exact opposite of what this is for. `clip-path` rather
       * than the deprecated `clip: rect(...)`.
       */
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <!-- A plain caption, NOT role="status". `#say` below is the one live region on this page:
         with both, a failure written to the strip and mirrored into #say is announced twice.
         Same split the garden uses — `#hint` is silent, `#say` speaks. -->
    <div id="strip">
      <span id="strip-text">you're visiting a shared garden</span>
      <a id="strip-back" href="../garden/">return to your own garden</a>
    </div>
    <div id="wrap"><canvas id="c" aria-hidden="true"></canvas></div>
    <div class="sr">
      <h1>A shared Heirloom garden</h1>
      <p>
        Someone else's garden, as it stood when they shared it. Nothing here can
        be planted, crossed, cloned or spliced — it is a photograph, and the
        plants in it will not grow any further.
      </p>
    </div>
    <!-- A list, not buttons: there is nothing to activate in a read-only garden, and a button
         that does nothing is worse than no button. -->
    <ul id="mirror" class="sr" aria-label="this garden"></ul>
    <p id="say" class="sr" aria-live="polite" aria-atomic="true"></p>
    <script type="module" src="./visit.ts"></script>
  </body>
</html>
